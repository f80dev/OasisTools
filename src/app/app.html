<!-- Splash Screen -->
<div *ngIf="splash_image" class="splash-overlay">
  <div class="apptitle">
    OASIS Tools
  </div>
  <img [src]="splash_image" class="splash-image" alt="Splash">
</div>

<mat-toolbar color="primary">
  <button mat-icon-button (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>{{ title() }}</span>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="over" position="start">
    <mat-nav-list style="height: 100vh;" (click)="sidenav.close()">
      <a mat-list-item routerLink="/">Accueil</a>
      <a mat-list-item routerLink="/evals">Évaluer des disciplines</a>
      <a mat-list-item routerLink="/search">Recherche des profils</a>
      <a mat-list-item routerLink="/docs">Imprimer des documents</a>
      <br>
      <a mat-list-item routerLink="/about">A propos</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
