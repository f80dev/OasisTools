<mat-toolbar color="primary">
  <button mat-icon-button (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>{{ title() }}</span>
</mat-toolbar>
<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" position="start">
    <mat-nav-list style="height: 100vh;">
      <a mat-list-item routerLink="/">Accueil</a>
      <a mat-list-item routerLink="/evals">Évaluer des disciplines</a>
      <a mat-list-item routerLink="/evals">Recherche des profils</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
