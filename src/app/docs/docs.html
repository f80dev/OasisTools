<div class="mainform">
  <div *ngIf="message!=''" style="display: flex;">
    <mat-progress-spinner [diameter]="20" mode="indeterminate" color="primary"></mat-progress-spinner>
    &nbsp;{{message}}
  </div>
  <br>

  <mat-form-field class="select-cursus">
    <mat-label>Cursus</mat-label>
    <mat-select [value]="selected_cursus" (selectionChange)="on_select_cursus($event)">
      <mat-option *ngFor="let item of cursus_list" [value]="item">
        {{item.NAME || item.CURSUS_NAME}}
      </mat-option>
    </mat-select>
  </mat-form-field>



  <div *ngIf="selected_cursus">
    <mat-form-field class="select-cursus">
      <mat-label>Etudiants</mat-label>
      <mat-select matNativeControl multiple id="student-select" #studentselect [(ngModel)]="selected_students" (selectionChange)="load_data()">
        <mat-option *ngFor="let student of student_list" [value]="student">
          {{student.FNAME}} {{student.LNAME}}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <button *ngIf="selected_cursus && message==''" style="margin: 10px;margin-top: -10px;"
            mat-raised-button (click)="select_all_students()">
      Tous
    </button>



    <br>

    <div *ngIf="!template || template_name==''">
      <label for="docx-file-input">Sélectionner un fichier .docx :</label>
      <input type="file" id="docx-file-input" accept=".docx" (change)="on_file_selected($event)">
    </div>

    <div *ngIf="template_name!=''" style="display: flex;">
      <span style="opacity: 0.5">Modèle sélectionné:&nbsp;</span> {{template_name.replace(".docx","")}}
      <button *ngIf="template && template_name"
              style="margin-top: -10px;margin-left: 10px;"
              mat-icon-button (click)="clear_doc()">
        <mat-icon>clear</mat-icon>
      </button>

    </div>

    <br><br>
  </div>



  <button *ngIf="template && selected_cursus && selected_students && selected_students.length>0 && message==''"
          mat-raised-button (click)="generate_doc()" color="primary">
    Générer
  </button>

  <mat-form-field *ngIf="template" class="select-format">
    <mat-label>Format</mat-label>
    <mat-select matNativeControl id="format" [(ngModel)]="selected_format">
      <mat-option value="docx">Word</mat-option>
      <mat-option value="pdf">PDF</mat-option>
    </mat-select>
  </mat-form-field>

</div>
