<div class="prefs-page">
  <div class="page-header">
    <h2>Préférences</h2>
    <p>Configuration de l'application OASIS Tools</p>
  </div>


  <!-- Eval Config Card -->
  <mat-card class="prefs-card">
    <mat-card-header>
      <mat-icon mat-card-avatar>assignment</mat-icon>
      <mat-card-title>Quelle version d'OASIS</mat-card-title>
      <mat-card-subtitle>Options d'import</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="form-row">
        <mat-form-field appearance="outline" class="url-field">
          <mat-label>Version OASIS</mat-label>
          <mat-select [(ngModel)]="evalProxyVersion">
            <mat-option value="prod">Production (cnsmdp.scolasis.com)</mat-option>
            <mat-option value="test">Test (testcnsmdp.scolasis.com)</mat-option>
          </mat-select>
          <mat-icon matPrefix>cloud</mat-icon>
        </mat-form-field>
      </div>

      <div class="config-options">
        <mat-checkbox [(ngModel)]="evalStopOnError">
          Arrêter les traitement à la première erreur
        </mat-checkbox>
        <br>
        <mat-checkbox [(ngModel)]="evalImportFirstLineOnly">
          Importer première ligne uniquement
        </mat-checkbox>
      </div>
    </mat-card-content>

    <mat-card-actions>
      <button mat-button (click)="reset()" title="Revenir aux valeurs par défaut">
        <mat-icon>restore</mat-icon>
        Réinitialiser
      </button>
      <button mat-raised-button color="primary" (click)="save()">
        <mat-icon>save</mat-icon>
        Sauvegarder
      </button>
    </mat-card-actions>
  </mat-card>



</div>
