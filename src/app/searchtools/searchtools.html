<div class="search-page">
  <div class="page-header">
    <h2>Recherche des profils</h2>
    <p>Recherche d'étudiants depuis le presse-papier</p>
  </div>

  <mat-card class="action-card">
    <mat-card-content>
      <div class="search-action">
        <mat-icon class="action-icon">content_paste</mat-icon>
        <p class="action-description">
          Collez des données dans votre presse-papier (format : Prénom Nom, un par ligne)
          puis cliquez sur le bouton ci-dessous pour lancer la recherche.
        </p>
        <button mat-raised-button color="primary" (click)="pasteFromClipboard()">
          <mat-icon>search</mat-icon>
          Analyser le presse-papier
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
